name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing (OIDC) needs npm >=11.5.1; pin to latest so the
      # runner's bundled npm version doesn't silently fall back to a token.
      - name: Ensure npm supports trusted publishing (OIDC)
        run: npm install -g npm@latest

      - name: Verify cli/package.json version matches the release tag
        working-directory: cli
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg_version" ]; then
            echo "::error::Release tag v$tag does not match cli/package.json version $pkg_version"
            exit 1
          fi

      # prepack (npm's own lifecycle hook) builds cli/vendor/ automatically.
      - name: Publish
        working-directory: cli
        run: npm publish
