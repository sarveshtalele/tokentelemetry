name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip "ruff==0.16.5"
          pip install -r backend/requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check backend telemetry hooks
      - name: Test
        run: python -m pytest tests/test_backend_api.py tests/test_reconcile.py -v

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Audit (fails on high/critical)
        run: npm audit --audit-level=high

  cli-smoke:
    name: CLI (syntax + install-time checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check every CLI script
        run: |
          for f in cli/bin/*.js cli/src/*.js cli/setup.js; do
            node --check "$f"
          done
